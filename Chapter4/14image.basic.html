<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>14image_basic</title>
    
</head>
<body>
    <h2>이미지 삽입하기</h2>
    <img src="Penguins.jpg" alt="펭귄" width="300">
    <img src="Nothing.jpg" alt="그림이 존재하지 않음" width="300">

    <h2>음악 삽입하기</h2>
    <audio src="Kalimba.mp3" controls="controls"></audio>

    <h2>웹 브라우저 제약이 없도록 음악 삽입</h2>
    <audio controls="controls">
        <source src="Kalimba.ogg" type="audio/ogg">
        <source src="Kalimba.mp3" type="audio/mpeg">
    </audio>

    <h2>동영상 삽입</h2>
    <video src="Wildlife.mp4" controls="controls" width="300">
        <source src="Wildlife.ogg" type="video/ogg">
        <source src="Wildlife.webm" type="video/webm">

    </video>

        <h2>동영상 불러오는 동안 다른 이미지 보여주기</h2>
        <video src="Wildlife.mp4" controls="controls" width="300" poster="Penguins.jpg">
            <source src="Wildlife.ogg" type="video/ogg">
            <source src="Wildlife.webm" type="video/webm">
        </video>

        


</body>
</html>
