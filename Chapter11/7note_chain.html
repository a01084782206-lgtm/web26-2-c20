<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Basic</title>
    <script>
        $(document).ready(function () {
            $('img').attr('alt','jqery 라이브러리르루사용한 속성지정')
            .attr('src','http://via.placeholder.com/100x100').attr('width','100');
        });
    </script>
    
</head>

<body> 
    <img>
    <img>
    <img>

<hr/>
<h2>메서드 체이닝:</h2> 
$( ) 함수를 여러 번 사용할 필요 없이 메서드를 연속해서 사용할 수 있음.
</body>

</html>
